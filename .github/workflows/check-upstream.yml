name: Check Upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for a new upstream BCHD release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LATEST=$(gh release view --repo gcash/bchd --json tagName -q '.tagName' 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then echo "Could not fetch upstream version"; exit 0; fi

          CURRENT="v$(sed -nE "s/^[[:space:]]*version:[[:space:]]*'([^:']+):.*/\1/p" startos/versions/current.ts | head -1)"

          if [ "$LATEST" = "$CURRENT" ]; then
            echo "Already at $LATEST — no update"
            exit 0
          fi

          # The package takes bchd from the official image, which upstream
          # publishes shortly after the release. Wait for it (next run retries).
          for arch in amd64 arm64; do
            if ! docker manifest inspect "ghcr.io/gcash/bchd:$LATEST" | grep -q "\"architecture\": \"$arch\""; then
              echo "ghcr.io/gcash/bchd:$LATEST has no $arch image yet — trying again next run"
              exit 0
            fi
          done

          echo "Updating $CURRENT -> $LATEST"
          BEFORE=$(git rev-parse HEAD)
          bash scripts/auto-bump.sh "$LATEST"
          # GITHUB_TOKEN pushes do not start Tag and Release.
          if [ "$(git rev-parse HEAD)" != "$BEFORE" ]; then gh workflow run tagAndRelease.yml; fi
        shell: bash
